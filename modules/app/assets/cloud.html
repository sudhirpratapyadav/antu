<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>antu — map</title>
<style>
/*
  The 3D map, ported from the jarvis scan viewer.

  Points arrive already in the tracker's world frame, so there is nothing to
  unproject here — only to draw. Same single screen, no scrollbars discipline as
  the console.
*/
:root {
  --bg: #0b0e13; --panel: rgba(16,21,29,.85); --line: rgba(120,140,170,.22);
  --text: #e9eff6; --dim: #93a1b4; --accent: #4da3ff; --warn: #ffa657;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  height: 100dvh; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  -webkit-user-select: none; user-select: none;
}
#bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
  padding: 8px 12px; border-bottom: 1px solid var(--line); background: #0e1319;
  padding-top: max(8px, env(safe-area-inset-top));
}
#bar .name { font-weight: 600; letter-spacing: .6px; font-size: 13px; }
.stat { display: flex; gap: 5px; align-items: baseline; }
.stat span { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
.stat b { font-variant-numeric: tabular-nums; }
.spacer { margin-left: auto; }
a { color: var(--accent); text-decoration: none; }
#view { flex: 1 1 auto; min-height: 0; position: relative; background: #05070a; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.overlay {
  position: absolute; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; backdrop-filter: blur(8px); padding: 8px 10px;
}
#hint { left: 10px; bottom: 10px; color: var(--dim); font-size: 10.5px; line-height: 1.7; pointer-events: none; }
#tools { right: 10px; top: 10px; display: flex; gap: 6px; }
button {
  font: inherit; color: var(--text); background: var(--panel); cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-height: 38px;
  backdrop-filter: blur(8px);
}
button:active { transform: translateY(1px); }
button.on { background: rgba(63,185,80,.22); border-color: rgba(63,185,80,.5); color: #7ee08b; }
#empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--dim); text-align: center; padding: 24px; line-height: 1.8;
}
</style>
</head>
<body>

<div id="bar">
  <div class="name">antu</div>
  <a href="/">← console</a>
  <div class="spacer"></div>
  <div class="stat"><span>points</span><b id="n">–</b></div>
  <div class="stat"><span>extent</span><b id="extent">–</b></div>
</div>

<div id="view">
  <canvas id="gl"></canvas>
  <div id="empty">no cloud yet — drive the robot and it will appear<br>
    <span style="font-size:10.5px">depth runs about once every six seconds</span></div>
  <div class="overlay" id="tools">
    <button id="fitBtn">fit</button>
    <button id="topBtn">top</button>
    <button id="liveBtn" class="on">live</button>
  </div>
  <div class="overlay" id="hint">drag rotate · shift-drag or two fingers pan · wheel or pinch zoom</div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

// ── viewer ────────────────────────────────────────────────────────────────
// Points are already in the tracker's world frame, which is y-up, so the camera
// uses y as its up vector and the whole thing needs no conversion.
let gl, prog, ptBuf, nPts = 0, xyz = null;
const cam = { px: 0, py: 0, pz: 0, yaw: 0.7, pitch: 0.5, dist: 6, fovy: 1.0 };
let live = true;

const VS = `
attribute vec3 pos; attribute vec3 col;
uniform mat4 mvp; uniform float size;
varying vec3 vcol;
void main() {
  gl_Position = mvp * vec4(pos, 1.0);
  // Nearer points draw larger, which reads as depth without any shading.
  gl_PointSize = max(1.0, size / max(gl_Position.w, 0.15));
  vcol = col;
}`;
const FS = `
precision mediump float;
varying vec3 vcol;
void main() { gl_FragColor = vec4(vcol, 1.0); }`;

function glInit() {
  gl = $('gl').getContext('webgl', { antialias: true });
  if (!gl) { $('empty').textContent = 'WebGL unavailable in this browser'; return false; }
  const sh = (t, src) => {
    const o = gl.createShader(t);
    gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o);
    return o;
  };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  ptBuf = gl.createBuffer();
  gl.enable(gl.DEPTH_TEST);
  return true;
}

function perspective(out, fovy, asp, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  out.fill(0);
  out[0] = f / asp; out[5] = f;
  out[10] = (far + near) * nf; out[11] = -1; out[14] = 2 * far * near * nf;
  return out;
}
function lookAt(out, eye, ctr, up) {
  let zx = eye[0]-ctr[0], zy = eye[1]-ctr[1], zz = eye[2]-ctr[2];
  let l = Math.hypot(zx, zy, zz) || 1; zx/=l; zy/=l; zz/=l;
  let xx = up[1]*zz - up[2]*zy, xy = up[2]*zx - up[0]*zz, xz = up[0]*zy - up[1]*zx;
  l = Math.hypot(xx, xy, xz) || 1; xx/=l; xy/=l; xz/=l;
  const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
  out[0]=xx; out[1]=yx; out[2]=zx; out[3]=0;
  out[4]=xy; out[5]=yy; out[6]=zy; out[7]=0;
  out[8]=xz; out[9]=yz; out[10]=zz; out[11]=0;
  out[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  out[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  out[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  out[15]=1;
  return out;
}
function mul(out, a, b) {
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 4; j++) {
      let v = 0;
      for (let k = 0; k < 4; k++) v += a[k*4+j] * b[i*4+k];
      out[i*4+j] = v;
    }
  }
  return out;
}
function eyePos() {
  const cp = Math.cos(cam.pitch);
  return [cam.px + cam.dist * cp * Math.sin(cam.yaw),
          cam.py + cam.dist * Math.sin(cam.pitch),
          cam.pz + cam.dist * cp * Math.cos(cam.yaw)];
}
function mvp() {
  const cv = $('gl');
  const P = perspective(new Float32Array(16), cam.fovy, (cv.width / cv.height) || 1, 0.02, 400);
  const V = lookAt(new Float32Array(16), eyePos(), [cam.px, cam.py, cam.pz], [0, 1, 0]);
  return mul(new Float32Array(16), P, V);
}

/** Count, then positions, then colours — packed, because JSON of this is huge. */
async function load() {
  try {
    const b = await (await fetch('/cloud.bin')).arrayBuffer();
    if (b.byteLength < 4) return;
    const n = new Int32Array(b, 0, 1)[0];
    nPts = n;
    $('n').textContent = n.toLocaleString();
    if (!n) return;
    $('empty').style.display = 'none';

    const pos = new Float32Array(b, 4, n * 3);
    const col = new Uint8Array(b, 4 + n * 12, n * 3);
    const first = !xyz;
    xyz = pos;

    if (!gl && !glInit()) return;
    const arr = new Float32Array(n * 6);
    for (let i = 0; i < n; i++) {
      arr[i*6] = pos[i*3]; arr[i*6+1] = pos[i*3+1]; arr[i*6+2] = pos[i*3+2];
      arr[i*6+3] = col[i*3]/255; arr[i*6+4] = col[i*3+1]/255; arr[i*6+5] = col[i*3+2]/255;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
    // Frame it once on arrival; after that leave the camera where it was put,
    // or it would snap away every few seconds as the cloud grows.
    if (first) fit(); else draw();
  } catch (e) {
    // The robot may be restarting; the next poll will find it.
  }
}

function bounds() {
  let x0=1e9,y0=1e9,z0=1e9,x1=-1e9,y1=-1e9,z1=-1e9;
  for (let i = 0; i < nPts; i++) {
    const x=xyz[i*3], y=xyz[i*3+1], z=xyz[i*3+2];
    if(x<x0)x0=x; if(y<y0)y0=y; if(z<z0)z0=z;
    if(x>x1)x1=x; if(y>y1)y1=y; if(z>z1)z1=z;
  }
  return [x0,y0,z0,x1,y1,z1];
}

function fit() {
  if (!xyz || !nPts) return;
  const [x0,y0,z0,x1,y1,z1] = bounds();
  cam.px=(x0+x1)/2; cam.py=(y0+y1)/2; cam.pz=(z0+z1)/2;
  cam.dist = Math.max(0.6, Math.hypot(x1-x0, y1-y0, z1-z0) * 0.9);
  $('extent').textContent =
    `${(x1-x0).toFixed(1)} × ${(y1-y0).toFixed(1)} × ${(z1-z0).toFixed(1)} m`;
  draw();
}

/** Straight down, which is the floor plan the occupancy grid also sees. */
// Not `top`: that is window.top, a non-configurable global, and a script-level
// declaration by that name is a SyntaxError that stops the whole script — the
// viewer showed "no cloud yet" forever with a full cloud on the server.
function topView() {
  if (!xyz || !nPts) return;
  const [x0,y0,z0,x1,y1,z1] = bounds();
  cam.px=(x0+x1)/2; cam.py=(y0+y1)/2; cam.pz=(z0+z1)/2;
  cam.pitch = 1.5; cam.yaw = 0;
  cam.dist = Math.max(0.6, Math.hypot(x1-x0, z1-z0) * 1.1);
  draw();
}

function draw() {
  if (!gl || !nPts) return;
  const cv = $('gl');
  const ratio = window.devicePixelRatio || 1;
  const w = Math.round(cv.clientWidth * ratio), h = Math.round(cv.clientHeight * ratio);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }

  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0.02, 0.028, 0.04, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);

  const pos = gl.getAttribLocation(prog, 'pos');
  const col = gl.getAttribLocation(prog, 'col');
  gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(col);
  gl.vertexAttribPointer(col, 3, gl.FLOAT, false, 24, 12);

  gl.uniformMatrix4fv(gl.getUniformLocation(prog, 'mvp'), false, mvp());
  gl.uniform1f(gl.getUniformLocation(prog, 'size'), 3.5 * ratio);
  gl.drawArrays(gl.POINTS, 0, nPts);
}

// ── gestures: drag rotates, two fingers or shift pans, pinch or wheel zooms ──
const ptrs = new Map();
let pinch0 = 0, last = null;
const cv = $('gl');

function panBy(dx, dy) {
  const e = eyePos();
  let fx = cam.px-e[0], fy = cam.py-e[1], fz = cam.pz-e[2];
  const fl = Math.hypot(fx,fy,fz)||1; fx/=fl; fy/=fl; fz/=fl;
  let rx = -fz, rz = fx;
  const rl = Math.hypot(rx,rz)||1; rx/=rl; rz/=rl;
  const ux = fy*rz, uy = fz*rx - fx*rz, uz = -fy*rx;
  const s = cam.dist * 0.0022;
  cam.px += (-rx*dx + ux*dy) * s;
  cam.py += (uy*dy) * s;
  cam.pz += (-rz*dx + uz*dy) * s;
}

cv.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  last = {x:e.clientX, y:e.clientY};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointerup', e => { ptrs.delete(e.pointerId); pinch0 = 0; });
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch0 = 0; });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !last) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size >= 2) {
    const p = [...ptrs.values()];
    const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    if (pinch0) cam.dist = Math.max(0.1, Math.min(120, cam.dist * (pinch0/d)));
    pinch0 = d;
    const mx=(p[0].x+p[1].x)/2, my=(p[0].y+p[1].y)/2;
    panBy(mx-last.x, my-last.y);
    last = {x:mx, y:my};
    draw(); e.preventDefault(); return;
  }
  const dx = e.clientX-last.x, dy = e.clientY-last.y;
  last = {x:e.clientX, y:e.clientY};
  if (e.shiftKey || e.buttons === 2 || e.buttons === 4) panBy(dx, dy);
  else {
    cam.yaw -= dx*0.006;
    // Stop just short of the poles, where the up vector degenerates and the
    // view flips over.
    cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy*0.006));
  }
  draw(); e.preventDefault();
});
cv.addEventListener('wheel', e => {
  cam.dist = Math.max(0.1, Math.min(120, cam.dist * (e.deltaY > 0 ? 1.1 : 0.9)));
  draw(); e.preventDefault();
}, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', draw);

$('fitBtn').onclick = fit;
$('topBtn').onclick = topView;
$('liveBtn').onclick = () => {
  live = !live;
  $('liveBtn').classList.toggle('on', live);
};

load();
// Depth produces a frame every few seconds, so polling faster would mostly
// re-fetch the same cloud.
setInterval(() => { if (live) load(); }, 3000);
</script>
</body>
</html>
